name: tomapto
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.7.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_naver_map: ^1.3.1
  geolocator: ^13.0.4
  flutter_dotenv: ^5.2.1
  permission_handler: ^12.0.0+1
  http: ^1.4.0
  dio: ^5.4.0
  flutter_svg: ^2.0.17
  shared_preferences: ^2.5.3
  lib: ^0.0.3
  intl: ^0.19.0

  image_picker: ^1.0.4

  socket_io_client: ^3.1.1
  flutter_local_notifications: ^19.1.0
  flutter_compass: ^0.8.1
  provider: ^6.1.5

  # Firebase 패키지들
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.2
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/tomapto.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
flutter_native_splash:
  color: "#ffffff"
  image: "assets/icons/intro_logo.png"
  android_12:
    image: "assets/icons/intro_logo.png"
    color: "#ffffff"
flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/PretendardVariable.ttf
        - asset: assets/fonts/Pretendard-Black.ttf
        - asset: assets/fonts/Pretendard-Bold.ttf
        - asset: assets/fonts/Pretendard-ExtraBold.ttf
        - asset: assets/fonts/Pretendard-ExtraLight.ttf
        - asset: assets/fonts/Pretendard-Light.ttf
        - asset: assets/fonts/Pretendard-Medium.ttf
        - asset: assets/fonts/Pretendard-Regular.ttf
        - asset: assets/fonts/Pretendard-SemiBold.ttf
        - asset: assets/fonts/Pretendard-Thin.ttf
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
